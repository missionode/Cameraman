<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="A simple and clean camera app.">
    <title>Camera</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --primary-color: #ffffff;
            --accent-color: #ffd700;
            --glass-bg: rgba(30, 30, 30, 0.45);
            --glass-border: rgba(255, 255, 255, 0.15);
            --blur-amount: 40px;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-family);
        }

        body {
            background: #000;
            color: #fff;
            height: 100vh;
            height: 100dvh;
            /* Mobile viewport fix */
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        .container {
            position: absolute;
            /* Changed from relative to absolute to force full filling */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* --- Viewfinder --- */
        #video,
        #canvas-output {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: translateZ(0);
            /* Force hardware accel */
            transition: opacity 0.3s ease;
        }

        #video {
            z-index: 1;
            opacity: 0;
            /* Hide raw video */
        }

        #canvas-output {
            z-index: 2;
            opacity: 1;
        }

        /* --- Dynamic Island (Top Bar) --- */
        .dynamic-island-container {
            position: absolute;
            top: 12px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
        }

        .dynamic-island {
            background: #000;
            border-radius: 20px;
            height: 36px;
            min-width: 120px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            transition: all 0.6s var(--ease-out-expo);
            pointer-events: auto;
            color: white;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .dynamic-island.recording {
            width: 160px;
            background: #1c1c1e;
        }

        .di-content {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .di-indicator {
            width: 6px;
            height: 6px;
            background: #4cd964;
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        .dynamic-island.recording .di-indicator {
            background: #ff3b30;
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.5);
            animation: pulse-red 2s infinite;
        }

        .di-timer {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
            color: #ff3b30;
        }

        /* --- Floating Controls (Side Islands) --- */
        .top-controls {
            position: absolute;
            top: 15px;
            width: 100%;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            z-index: 90;
            pointer-events: none;
        }

        .glass-pill {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            height: 44px;
            width: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            transition: transform 0.2s ease, background 0.3s;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        .glass-pill:active {
            transform: scale(0.92);
            background: rgba(50, 50, 50, 0.6);
        }

        .icon-btn {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
            stroke: white;
            stroke-width: 0.5px;
        }

        /* --- Bottom Controls --- */
        .controls {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            padding: 0 20px;
        }

        .control-btn-secondary {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .control-btn-secondary:active {
            transform: scale(0.92);
            background: rgba(60, 60, 60, 0.6);
        }

        .control-btn-secondary svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        /* --- Shutter Button --- */
        #record-container {
            position: relative;
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #record {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: transparent;
            border: 5px solid white;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #record .inner-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #ff3b30;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #record.recording {
            border-width: 6px;
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        #record.recording .inner-circle {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        /* --- Slider --- */
        .slider-container {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            height: 220px;
            width: 44px;
            z-index: 95;
            display: flex;
            justify-content: center;
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 22px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 10px 0;
        }

        .slider-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        input[type=range][orient=vertical] {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            appearance: slider-vertical;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        /* --- Panels --- */
        .panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.01);
            /* Transparent logic mostly handled by content */
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .panel-overlay.active {
            opacity: 1;
            display: flex;
        }

        .panel-content {
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(50px) saturate(180%);
            -webkit-backdrop-filter: blur(50px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 24px;
            border-radius: 32px;
            width: 85%;
            max-width: 360px;
            max-height: 70vh;
            overflow-y: auto;
            color: white;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.95);
            transition: transform 0.25s var(--ease-out-expo);
        }

        .panel-overlay.active .panel-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ccc;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .settings-group {
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 16px;
        }

        .settings-group:last-child {
            border-bottom: none;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: white;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            appearance: none;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #4cd964;
        }

        small {
            color: #888;
            font-size: 12px;
        }

        /* --- Animations --- */
        @keyframes pulse-red {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        .hidden {
            display: none !important;
        }

        /* --- Toast Notification --- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10000;
            width: 90%;
            max-width: 320px;
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            opacity: 0;
            pointer-events: none;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: all;
        }

        .toast span {
            color: white;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            line-height: 1.4;
        }

        .toast-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .toast-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .toast-buttons button:active {
            transform: scale(0.96);
        }

        #toast-install-btn {
            background: #4cd964;
            color: black;
        }

        #toast-dismiss-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>

</head>

<body>
    <div class="container" id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas-output"></canvas>

        <!-- Dynamic Island -->
        <div class="dynamic-island-container">
            <div class="dynamic-island" id="dynamic-island">
                <div class="di-content">
                    <div class="di-indicator" id="di-indicator"></div>
                    <span id="di-status" style="font-size: 13px;">Camera</span>
                </div>
                <div class="di-content hidden" id="di-timer-container">
                    <span class="di-timer" id="di-timer">00:00</span>
                </div>
            </div>
        </div>

        <!-- Top Controls -->
        <div class="top-controls">
            <!-- Handbook: Book Icon -->
            <div class="glass-pill">
                <button class="icon-btn" id="handbook-btn" title="Handbook">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" />
                        <path d="M6 7h12v2H6zm0 4h12v2H6zm0 4h8v2H6z" />
                    </svg>
                </button>
            </div>

            <!-- Settings: Gear Icon (Rounder) -->
            <div class="glass-pill">
                <button class="icon-btn" id="settings-btn" title="Settings">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84a.484.484 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Slider -->
        <div class="slider-container" id="focus-slider-container">
            <input type="range" id="focus-distance" min="0" max="1" step="0.01" orient="vertical">
        </div>

        <!-- Bottom Controls -->
        <div class="controls">
            <!-- Switch Cam: Loop Icon -->
            <button class="control-btn-secondary" id="toggle-camera" title="Switch Camera">
                <svg viewBox="0 0 24 24">
                    <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                </svg>
            </button>

            <div id="record-container" title="Record">
                <div id="record">
                    <div class="inner-circle"></div>
                </div>
            </div>

            <!-- Capture: Photo Icon -->
            <button class="control-btn-secondary" id="capture" title="Photo">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" />
                </svg>
            </button>
        </div>

        <div class="toast" id="install-toast">
            <span>Install this app for the best experience!</span>
            <div class="toast-buttons">
                <button id="toast-dismiss-btn">Later</button>
                <button id="toast-install-btn">Install</button>
            </div>
        </div>
    </div>

    <!-- Layouts for Panels (Re-using structures but better styled) -->
    <div class="panel-overlay" id="handbook-panel">
        <div class="panel-content">
            <button class="close-btn" id="close-handbook-btn">&times;</button>
            <h2>Handbook</h2>
            <div id="handbook-content-container"></div>
        </div>
    </div>

    <div class="panel-overlay" id="settings-modal">
        <div class="panel-content">
            <button class="close-btn" id="close-settings-btn">&times;</button>
            <h2>Settings</h2>

            <div class="settings-group">
                <label for="aspect-ratio">Aspect Ratio</label>
                <select id="aspect-ratio"></select>
            </div>

            <div class="settings-group">
                <label for="color-grading">Color Grading</label>
                <select id="color-grading"></select>
            </div>

            <div class="settings-group">
                <label for="center-stage-toggle" style="justify-content: flex-start; gap: 10px;">
                    <input type="checkbox" id="center-stage-toggle">
                    <span>Center Stage</span>
                </label>
                <div id="movie-mode-container" style="margin-left: 30px; margin-top: 10px; display: none;">
                    <label for="movie-mode-toggle" style="justify-content: flex-start; gap: 10px; font-size: 14px;">
                        <input type="checkbox" id="movie-mode-toggle">
                        <span>Movie Mode</span>
                    </label>
                    <small>Tracks full figure instead of just face.</small>
                </div>
                <small style="display:block; margin-top:4px;">Auto-zoom to keep you in frame.</small>
            </div>

            <div class="settings-group">
                <label for="apply-grade-to-video" style="justify-content: flex-start; gap: 10px;">
                    <input type="checkbox" id="apply-grade-to-video">
                    <span>Grade in Recording</span>
                </label>
                <small style="display:block; margin-top:4px;">Apply color effects to saved video.</small>
            </div>

            <div class="settings-group">
                <label>Storage Location</label>
                <div style="display: flex; gap: 10px; align-items: center; margin-top: 8px;">
                    <button id="choose-folder-btn" class="control-btn-secondary" style="width: auto; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14px; background: rgba(255,255,255,0.1);">
                        Choose Folder
                    </button>
                    <span id="folder-name-display" style="font-size: 13px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;">Not Set</span>
                </div>
                <small style="display:block; margin-top:4px;">Files will save here automatically.</small>
            </div>

            <!-- Hidden groups unless supported -->
            <div class="settings-group" id="focus-control-group" style="display: none;">
                <label for="focus-mode">Focus Mode</label>
                <select id="focus-mode">
                    <option value="continuous">Auto</option>
                    <option value="manual">Manual</option>
                </select>
            </div>

            <div class="settings-group" id="video-stabilization-group" style="display: none;">
                <label for="video-stabilization">Stabilization</label>
                <select id="video-stabilization">
                    <option value="off">Off</option>
                    <option value="realtime">Real-time</option>
                    <option value="cinematic">Cinematic</option>
                </select>
            </div>

            <div class="settings-group" id="noise-suppression-group" style="display: none;">
                <label for="noise-suppression" style="justify-content: flex-start; gap: 10px;">
                    <input type="checkbox" id="noise-suppression">
                    <span>Noise Suppression</span>
                </label>
            </div>

            <div class="settings-group">
                <label for="director-mode-toggle" style="justify-content: flex-start; gap: 10px;">
                    <input type="checkbox" id="director-mode-toggle">
                    <span>Director Mode</span>
                </label>
                <small style="display:block; margin-top:4px;">Voice commands: "Action" to Record, "Thank you" to
                    Stop.</small>
            </div>
        </div>
    </div>

    <script type="module">
        import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/+esm";

        // --- CONFIGURATION ---
        const config = {
            aspectRatios: [
                { name: '16:9', value: 1.7777777778 },
                { name: '4:3', value: 1.3333333333 },
                { name: '1:1', value: 1.0 },
                { name: '9:16 (Portrait)', value: 0.5625 },
                { name: '2.39:1', value: 2.39 }
            ],
            colorGradings: [
                { name: 'None', value: 'none' },
                { name: 'Empuraan', value: 'empuraan' },
                { name: 'Meiyazhagan', value: 'meiyazhagan' },
                { name: 'KGF', value: 'kgf' },
                { name: 'Salaar', value: 'salaar' },
                { name: 'Noir', value: 'noir' },
                { name: 'Vintage', value: 'vintage' },
                { name: 'Bleach Bypass', value: 'bleach-bypass' },
                { name: 'Teal & Orange', value: 'teal-orange' },
                { name: 'Matrix', value: 'matrix' }
            ]
        };

        // --- DOM ELEMENTS ---
        const video = document.getElementById('video');
        const canvasOutput = document.getElementById('canvas-output');
        const container = document.getElementById('container');

        const dynamicIsland = document.getElementById('dynamic-island');
        const diIndicator = document.getElementById('di-indicator');
        const diStatus = document.getElementById('di-status');
        const diTimer = document.getElementById('di-timer');
        const diTimerContainer = document.getElementById('di-timer-container');

        const toggleCameraButton = document.getElementById('toggle-camera');
        const captureButton = document.getElementById('capture');
        const recordContainer = document.getElementById('record-container');
        const recordBtnInner = document.querySelector('#record');

        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const aspectRatioSelect = document.getElementById('aspect-ratio');
        const colorGradingSelect = document.getElementById('color-grading');

        // --- APP STATE ---
        let stream = null;
        let currentFacingMode = 'environment'; // Default to Back Camera for Mobile
        let currentAspectRatio = config.aspectRatios[0].value;
        let centerStageEnabled = false;
        let movieModeEnabled = false;
        let directorModeEnabled = false;
        let applyGradeToVideo = true;
        let isRecording = false;
        let isCountingDown = false; // Guard against multiple triggers
        let isHandingOverMic = false; // Guard against onend restart
        let faceDetector = null;
        let lastDetectionTime = 0;
        let lastVideoTime = -1;

        let recognition = null;
        let audioCtx = null;
        let saveDirectoryHandle = null; // Renamed from directorDirectoryHandle for general use
        let speechRestartTimeout = null;
        let lastSpeechEndTime = 0;

        let currentCrop = { x: 0, y: 0, width: 1, height: 1 };
        let targetCrop = { x: 0, y: 0, width: 1, height: 1 };

        let mediaRecorder = null;
        let fileHandle = null;
        let recorderWorker = null;
        let videoProcessorWorker = null; // [NEW]
        let recordingStartTime = 0;
        let recordingInterval = null;
        let destinationStream = null;
        let uiTimeout = null;
        let isSwitchingMode = false; // Guard for intentional mic handoff

        // State for smooth tracking
        let smoothCentroidX = 0.5;
        let smoothCentroidY = 0.5;
        let smoothFaceWidth = 0.5;

        // --- PERSISTENCE HELPERS ---
        async function saveHandleToDB(handle) {
            const db = await openDB();
            const tx = db.transaction('settings', 'readwrite');
            await tx.objectStore('settings').put(handle, 'saveDirectory');
        }

        async function getHandleFromDB() {
            const db = await openDB();
            return new Promise((resolve) => {
                const request = db.transaction('settings').objectStore('settings').get('saveDirectory');
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => resolve(null);
            });
        }

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('CameramanDB', 1);
                request.onupgradeneeded = () => request.result.createObjectStore('settings');
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function getCameraCapabilities() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                const audioDevices = devices.filter(device => device.kind === 'audioinput');

                let audioEnabled = false;
                if (audioDevices.length > 0) {
                    // Check if we have permission to use the microphone
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        stream.getTracks().forEach(track => track.stop());
                        audioEnabled = true;
                    } catch (e) {
                        // Could not get audio permission
                    }
                }

                return {
                    video: videoDevices.length > 0,
                    audio: audioEnabled
                };
            } catch (e) {
                return {
                    video: false,
                    audio: false
                };
            }
        }

        // --- CORE CAMERA ---
        async function startCamera() {
            updateDynamicIsland('Loading...');
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            const capabilities = await getCameraCapabilities();

            const constraints = {
                video: {
                    width: { ideal: 4096 },
                    height: { ideal: 2160 },
                    aspectRatio: { ideal: currentAspectRatio },
                    facingMode: currentFacingMode
                },
                audio: capabilities.audio
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;

                // Wait for video to play to get dimensions
                await new Promise(r => video.onloadedmetadata = r);

                // Setup destination stream for recorder
                const canvasStream = canvasOutput.captureStream(30);
                destinationStream = new MediaStream(canvasStream.getVideoTracks()); // Audio added on record start

                // [NEW] Check & Setup Capabilities (Focus/Zoom)
                const track = stream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                const settings = track.getSettings();
                const sliderContainer = document.getElementById('focus-slider-container');
                const focusInput = document.getElementById('focus-distance');

                if (capabilities.focusMode && capabilities.focusMode.includes('manual') && capabilities.focusDistance) {
                    sliderContainer.classList.add('visible'); // Show slider
                    sliderContainer.style.pointerEvents = 'auto'; // Ensure clickable

                    // Set bounds (usually 0.0 to 1.0 for mobile web)
                    focusInput.min = capabilities.focusDistance.min || 0;
                    focusInput.max = capabilities.focusDistance.max || 1;
                    focusInput.step = capabilities.focusDistance.step || 0.01;
                    focusInput.value = settings.focusDistance || 0;

                    focusInput.oninput = async (e) => {
                        try {
                            await track.applyConstraints({
                                advanced: [{
                                    focusMode: 'manual',
                                    focusDistance: parseFloat(e.target.value)
                                }]
                            });
                        } catch (err) {
                            console.warn("Focus failed", err);
                        }
                    };
                } else {
                    sliderContainer.classList.remove('visible'); // Hide if not supported
                }

                updateDynamicIsland('Ready');
            } catch (err) {
                console.error(err);
                updateDynamicIsland('Error', 'Camera Access', 'red');

        // --- CANVAS LOOP (MAIN THREAD CONTROLLER) ---
        async function canvasLoop() {
            if (!video || video.paused || video.ended) {
                requestAnimationFrame(canvasLoop);
                return;
            }

            // --- 1. Calculate Logic (Layout, Crop, AI) ---
            
            // Resize Calculations
            const srcRatio = video.videoWidth / video.videoHeight;
            let targetW, targetH;

            if (currentAspectRatio >= srcRatio) {
                targetW = video.videoWidth;
                targetH = targetW / currentAspectRatio;
            } else {
                targetH = video.videoHeight;
                targetW = targetH * currentAspectRatio;
            }

            // Cap Resolution
            const MAX_DIMENSION = 1280;
            if (targetW > MAX_DIMENSION || targetH > MAX_DIMENSION) {
                const scale = Math.min(MAX_DIMENSION / targetW, MAX_DIMENSION / targetH);
                targetW *= scale;
                targetH *= scale;
            }
            
            // Ensure integer
            targetW = Math.floor(targetW);
            targetH = Math.floor(targetH);

            // 2. Face Tracking / Crop Logic (Same as before)
            if (centerStageEnabled && faceDetector) {
                processCenterStage();
            } else {
                const srcRatio = video.videoWidth / video.videoHeight;
                let w = 1, h = 1;
                const ratioMultiplier = currentAspectRatio / srcRatio;

                if (ratioMultiplier > 1) {
                    h = 1 / ratioMultiplier;
                } else {
                    w = 1 * ratioMultiplier;
                }

                const tx = (1 - w) / 2;
                const ty = (1 - h) / 2;

                targetCrop = { x: tx, y: ty, width: w, height: h };
            }

            // [IMPROVED] Adaptive Tracking Speed
            // Calculate distance to target (How far off are we?)
            const dx = targetCrop.x - currentCrop.x;
            const dy = targetCrop.y - currentCrop.y;
            const dw = targetCrop.width - currentCrop.width;
            
            // Distance metric (Euclidean-ish)
            const distance = Math.sqrt(dx*dx + dy*dy + dw*dw);

            // Adaptive Speed Logic:
            // - If distance is small (< 0.01), stick to 0.02 (Very heavy/smooth)
            // - If distance is large (> 0.2), ramp up to 0.15 (Fast/Sport mode)
            // Function: Base + (Distance^Power) * Multiplier
            let speed = 0.03 + Math.pow(distance, 1.5) * 2.0;
            
            // Clamp speed to sane limits
            speed = Math.max(0.01, Math.min(0.2, speed));

            currentCrop.x += (targetCrop.x - currentCrop.x) * speed;
            currentCrop.y += (targetCrop.y - currentCrop.y) * speed;
            currentCrop.width += (targetCrop.width - currentCrop.width) * speed;
            currentCrop.height += (targetCrop.height - currentCrop.height) * speed;


            // --- 2. Send to Worker for Rendering ---
            try {
                // [OPTIMIZATION] Create bitmap efficiently
                const bitmap = await createImageBitmap(video);
                
                // Post to worker
                videoProcessorWorker.postMessage({
                    type: 'render',
                    payload: {
                        bitmap: bitmap,
                        crop: currentCrop,
                        grading: colorGradingSelect.value,
                        width: targetW,
                        height: targetH,
                        isMirror: currentFacingMode === 'user'
                    }
                }, [bitmap]); // Transfer the bitmap!

            } catch (e) {
                // Frame dropped or error (e.g., video not ready)
            }

            requestAnimationFrame(canvasLoop);
        }

        function processCenterStage() {
            const now = performance.now();
            if (now - lastDetectionTime < 100) return; // Run faster (10FPS) for responsiveness
            lastDetectionTime = now;

            const results = faceDetector.detectForVideo(video, now);

            if (results.detections.length > 0) {
                // 1. Calculate Weighted Centroid
                let totalX = 0, totalY = 0;
                let minX = 1, maxX = 0;

                results.detections.forEach(d => {
                    const b = d.boundingBox;
                    const cx = (b.originX + b.width / 2) / video.videoWidth;
                    const cy = (b.originY + b.height / 2) / video.videoHeight;
                    totalX += cx;
                    totalY += cy;

                    const nx = b.originX / video.videoWidth;
                    const nw = b.width / video.videoWidth;
                    if (nx < minX) minX = nx;
                    if (nx + nw > maxX) maxX = nx + nw;
                });

                const rawCentroidX = totalX / results.detections.length;
                const rawCentroidY = totalY / results.detections.length;
                const rawFaceWidth = maxX - minX;

                // [IMPROVED] Hysteresis / Deadzone
                // Only move target if subject moves significantly (prevent jitters)
                const deadzone = 0.02; // 2% of screen
                if (Math.abs(rawCentroidX - smoothCentroidX) > deadzone) {
                    smoothCentroidX += (rawCentroidX - smoothCentroidX) * 0.1;
                }
                if (Math.abs(rawCentroidY - smoothCentroidY) > deadzone) {
                    smoothCentroidY += (rawCentroidY - smoothCentroidY) * 0.1;
                }
                if (Math.abs(rawFaceWidth - smoothFaceWidth) > 0.05) {
                    smoothFaceWidth += (rawFaceWidth - smoothFaceWidth) * 0.1;
                }

                let desiredCropWidth;

                if (movieModeEnabled) {
                    // MOVIE MODE: Wide & Cinematic
                    // Target Face Width in Frame = ~12% (Full Shot)
                    desiredCropWidth = Math.min(1.0, smoothFaceWidth * 6.0);
                    desiredCropWidth = Math.max(0.6, desiredCropWidth); // Never zoom in too close

                } else {
                    // STANDARD: Intimacy / Vlog
                    // Target Face Width in Frame = ~30% (Medium Close Up)
                    desiredCropWidth = Math.min(1.0, smoothFaceWidth * 2.5);
                    desiredCropWidth = Math.max(0.4, desiredCropWidth);
                }

                // Apply Aspect Ratio
                let w = desiredCropWidth;
                let h = w;
                const screenAspect = video.videoWidth / video.videoHeight;
                const ratioMultiplier = currentAspectRatio / screenAspect;

                if (ratioMultiplier > 1) {
                    h = w / ratioMultiplier; // Crop is wider than screen
                } else {
                    w = 1 * ratioMultiplier; // Crop is narrower (e.g. 9:16)
                    h = w / ratioMultiplier;
                }
                
                // Clamp max size
                if (w > 1.0) { w = 1.0; h = w / ratioMultiplier; }
                if (h > 1.0) { h = 1.0; w = h * ratioMultiplier; }

                // 3. Position the Crop (Rule of Thirds)
                let x = smoothCentroidX - w / 2;
                let y = smoothCentroidY - h / 2;

                if (movieModeEnabled) {
                    // Cinematic Headroom: Eyes at top 1/3 line
                    // Center of face (smoothCentroidY) should be at 35% from top of crop
                    y = smoothCentroidY - h * 0.35;
                } else {
                    // Standard: Slightly above center (Optical Center)
                    y = smoothCentroidY - h * 0.45;
                }

                // Clamp to video bounds
                x = Math.max(0, Math.min(1 - w, x));
                y = Math.max(0, Math.min(1 - h, y));

                targetCrop = { x, y, width: w, height: h };

            } else {
                 // No Face? Slowly drift back to wide shot
                 if (targetCrop) {
                    // Drift to center
                    targetCrop.x += ( (1-targetCrop.width)/2 - targetCrop.x ) * 0.01;
                    targetCrop.y += ( (1-targetCrop.height)/2 - targetCrop.y ) * 0.01;
                 }
            }
        }

        // --- DIRECTOR MODE ---
        function setupDirectorMode() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {

        function createSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (recognition) {
                try { recognition.abort(); } catch (e) { }
                recognition = null;
            }

            console.log("Initializing Speech Recognition Instance...");
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'en-US';
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onresult = (event) => {
                if (!event.results) return;
                const result = event.results[event.resultIndex];
                const transcript = result[0].transcript.trim().toLowerCase();
                const isFinal = result.isFinal;

                console.log(`Director heard (${isFinal ? 'Final' : 'Interim'}):`, transcript);

                if (isFinal || transcript.length > 3) {
                    if (!isRecording || transcript.includes('thank') || transcript.includes('cut')) {
                        updateDynamicIsland(`Heard: "${transcript}"`);
                    }
                }

                if (isFinal) {
                    let commandTriggered = false;
                    if ((/^(action|start|shoot)$/i.test(transcript)) && !isRecording) {
                        startRecordingWithCountdown();
                        commandTriggered = true;
                    } else if ((/^(thank you|cut|stop)$/i.test(transcript)) && isRecording) {
                        stopRecordingWithCountdown();
                        commandTriggered = true;
                    }
                }
            };

            recognition.onstart = () => {
                console.log("Speech Recognition: Started");
                if (!isRecording) updateDynamicIsland("Mic Active - Speak Now");
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    console.error("Speech Permission Denied");
                    directorModeEnabled = false;
                    document.getElementById('director-mode-toggle').checked = false;
                    updateDynamicIsland("Mic Denied", "Director Mode Off", "red");
                    return;
                }
                if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    // updateDynamicIsland(`Mic Error: ${event.error}`, '', 'orange');
                    console.warn("Speech Error:", event.error);
                }
            };

            recognition.onend = () => {
                console.log("Speech Recognition: Ended");

                if (isSwitchingMode) {
                    console.log("Intentional text-to-record switch. No restart.");
                    return;
                }

                if (directorModeEnabled && !isRecording) {
                    const timeSinceLastEnd = Date.now() - lastSpeechEndTime;
                    lastSpeechEndTime = Date.now();
                    let delay = 100;
                    if (timeSinceLastEnd < 1000) delay = 2000;

                    clearTimeout(speechRestartTimeout);
                    speechRestartTimeout = setTimeout(() => {
                        if (directorModeEnabled && recognition && !isRecording && !isSwitchingMode) {
                            try {
                                console.log("Restarting Speech...");
                                recognition.start();
                            } catch (e) { }
                        }
                    }, delay);
                }
            };
        }

        function startListening() {
            if (recognition) {

        async function startRecordingWithCountdown() {
            if (isRecording || isCountingDown) return;
            isCountingDown = true;

            // Audio Context for Beeps
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            let count = 3;
            updateDynamicIsland(count.toString());
            playTone(800, 0.1);

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    updateDynamicIsland(count.toString());
                    playTone(800, 0.1);
                } else {
                    clearInterval(interval);
                    updateDynamicIsland("ACTION!");
                    playTone(1200, 0.4); // Higher pitch for start
                    setTimeout(() => {
                        startRecording();
                        isCountingDown = false;
                    }, 500);
                }
            }, 1000);
        }

        async function stopRecordingWithCountdown() {
            if (!isRecording) return;

            // Audio Context
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            let count = 3;
            updateDynamicIsland("CUT IN " + count);
            playTone(600, 0.1);

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    updateDynamicIsland("CUT IN " + count);
                    playTone(600, 0.1);
                } else {
                    clearInterval(interval);
                    updateDynamicIsland("CUT!");
                    // Play cut sound inside stopRecording will handle the final tone
                    setTimeout(() => stopRecording(), 200);
                }
            }, 1000);
        }

        function playTone(freq, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        // --- MIC HANDOFF HELPERS ---
        async function prepareMicForRecording() {
            if (!directorModeEnabled || !recognition) return;

            updateDynamicIsland("Mic Swapping...");
            isSwitchingMode = true;

            return new Promise(resolve => {
                let resolved = false;
                const safetyTimeout = setTimeout(() => {
                    if (!resolved) {
                        console.warn("Speech stop timed out, forcing proceed");
                        resolved = true;
                        resolve();
                    }
                }, 1500);

                // Hook one-time listener to confirm it actually stopped
                if (recognition) {
                    recognition.onend = () => {
                        if (!resolved) {
                            console.log("Speech released (onend)");
                            clearTimeout(safetyTimeout);
                            resolved = true;
                            resolve();
                        }
                    };

                    // NUCLEAR: Abort and Destroy to force OS release
                    try {
                        recognition.abort();
                        recognition = null; // Mark as null immediately so we don't try to use it
                    } catch (e) {
                        resolve();
                    }
                } else {
                    resolve();
                }
            });
        }

        async function getAudioStreamWithRetry(retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    return await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true }
                    });
                } catch (e) {
                    console.warn(`Audio Access Attempt ${i + 1} failed:`, e);
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, 500)); // Wait 500ms before retry
                }
            }
        }

        async function startRecording() {
            if (isRecording) return;

            // 1. [FIX] Graceful Mic Handoff
            await prepareMicForRecording();

            // Additional small delay for OS audio layer to settle
            await new Promise(r => setTimeout(r, 300));

            try {
                const mimeType = getSupportedMimeType();
                const extension = mimeType.includes('mp4') ? 'mp4' : 'webm';

                // Auto-Save logic (Director Mode OR Default Folder)
                if (saveDirectoryHandle) {
                    const filename = `take-${new Date().toISOString().replace(/[:.]/g, '-')}.${extension}`;
                    try {
                        fileHandle = await saveDirectoryHandle.getFileHandle(filename, { create: true });
                    } catch (err) {
                        // Handle lost permission or error
                        console.error("Auto-save failed, falling back to prompt", err);
                        saveDirectoryHandle = null; // Reset
                         try {
                            fileHandle = await window.showSaveFilePicker({
                                suggestedName: `video-${Date.now()}.${extension}`,
                                types: [{
                                    description: 'Video File',
                                    accept: { [mimeType.split(';')[0]]: ['.' + extension] }
                                }]
                            });
                        } catch (pickerErr) {
                            if (pickerErr.name === 'AbortError') return;
                            throw pickerErr;
                        }
                    }
                } else {
                    // Manual Mode
                    try {
                        fileHandle = await window.showSaveFilePicker({
                            suggestedName: `video-${Date.now()}.${extension}`,
                            types: [{
                                description: 'Video File',
                                accept: { [mimeType.split(';')[0]]: ['.' + extension] }
                            }]
                        });
                    } catch (err) {
                        if (err.name === 'AbortError') return; // User cancelled
                        throw err;
                    }
                }

                // [OPTIMIZATION] Transfer Handle to Worker
                // Let the worker open the file to avoid "DataCloneError" and blocking main thread
                recorderWorker.postMessage({
                    type: 'init',
                    payload: { fileHandle: fileHandle }
                });

                // 2. [FIX] Request Audio Stream with RETRY
                let audioStream;
                try {
                    audioStream = await getAudioStreamWithRetry();
                } catch (err) {
                    throw new Error("Mic Busy: " + err.message);
                }

                // 3. Combine with Video
                const audioTrack = audioStream.getAudioTracks()[0];
                const combinedStream = new MediaStream([
                    ...destinationStream.getVideoTracks(),
                    audioTrack
                ]);

                if (directorModeEnabled) {
                    updateDynamicIsland("Recording (Tap to Stop)");
                }

                mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mimeType, videoBitsPerSecond: 10000000 });

                // Store audio track to stop it later
                mediaRecorder.audioTrack = audioTrack;
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        // [OPTIMIZATION] Send chunk to worker
                        recorderWorker.postMessage({
                            type: 'write',
                            payload: { data: e.data }
                        });
                        diIndicator.style.opacity = (diIndicator.style.opacity === '1' ? '0.5' : '1');
                    }
                };
                mediaRecorder.onstop = async () => {
                    // [OPTIMIZATION] Tell worker to finish
                    recorderWorker.postMessage({ type: 'close' });

                    // Stop Audio Track
                    if (mediaRecorder.audioTrack) {
                        mediaRecorder.audioTrack.stop();
                    }

                    // [FIX] Restore Director Mode if needed
                    restoreMicAfterRecording();

                    isRecording = false;
                    recordBtnInner.classList.remove('recording');
                    diTimerContainer.classList.add('hidden');
                    updateDynamicIsland("Saving..."); 
                    clearTimeout(recordingInterval);
                };

                mediaRecorder.start(1000);
                isRecording = true;
                recordingStartTime = Date.now();

                dynamicIsland.classList.add('recording');
                diTimerContainer.classList.remove('hidden');
                recordBtnInner.classList.add('recording');
                updateDynamicIsland('Recording', '', 'red');
                updateTimer();

            } catch (e) {
                console.error(e);
                // Show specific error in UI
                let msg = "Start Failed";
                if (e.message.includes("Mic Busy")) msg = "Mic Busy (Retry)";
                if (e.message.includes("Storage")) msg = "Check Folder";

                updateDynamicIsland("Error", msg, "red");

                // If start failed, ensure we restore mic
                restoreMicAfterRecording();
            }
        }

        function restoreMicAfterRecording() {
            if (!directorModeEnabled) return;

            isSwitchingMode = false;
            // Re-create instance to be safe
            setTimeout(() => {
                try {
                    createSpeechRecognition();
                    recognition.start();
                    updateDynamicIsland("Director Mode Ready");
                } catch (e) { console.warn("Restart director failed", e); }
            }, 500);
        }

        function updateDynamicIsland(text, subtext = '', color = 'green') {
            diStatus.textContent = text + (subtext ? ` | ${subtext}` : '');
            diIndicator.style.background = color === 'red' ? '#ff3b30' : '#4cd964';
        }

        // --- RECORDING ---
        recordContainer.onclick = async () => {
            if (!isRecording) {
                // FALLBACK: If Director Mode is on, clicking button triggers the "Action" sequence
                if (directorModeEnabled) {
                    await startRecordingWithCountdown();
                } else {
                    await startRecording();
                }
            } else {
                // Stop is always immediate for safety on button click
                stopRecording();
            }
        };

        // --- PHOTO CAPTURE ---
        captureButton.onclick = async () => {
            // Flash effect
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.backgroundColor = 'white';
            flash.style.opacity = '0.8';
            flash.style.transition = 'opacity 0.2s';
            flash.style.zIndex = '9999';
            document.body.appendChild(flash);
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => document.body.removeChild(flash), 200);
            }, 50);

            // Shutter Sound
            playTone(800, 0.05);

            canvasOutput.toBlob(async (blob) => {
                if (!blob) return;
                try {
                    let handle;
                    if (saveDirectoryHandle) {
                        const filename = `photo-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
                        try {
                             handle = await saveDirectoryHandle.getFileHandle(filename, { create: true });
                        } catch (e) {
                            // Fallback
                            saveDirectoryHandle = null;
                            handle = await window.showSaveFilePicker({
                                suggestedName: `photo-${Date.now()}.png`,
                                types: [{ description: 'PNG Image', accept: { 'image/png': ['.png'] } }]
                            });
                        }
                    } else {
                        handle = await window.showSaveFilePicker({
                            suggestedName: `photo-${Date.now()}.png`,
                            types: [{ description: 'PNG Image', accept: { 'image/png': ['.png'] } }]
                        });
                    }
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    updateDynamicIsland("Photo Saved");
                    setTimeout(() => updateDynamicIsland("Ready"), 1500);
                } catch (err) {
                    if (err.name !== 'AbortError') {
                         console.error("Photo Save Failed", err);
                         updateDynamicIsland("Error", "Save Failed", "red");
                    }
                }
            }, 'image/png');
        };

        function stopRecording() {
            if (!isRecording) return;
            mediaRecorder.stop();
            isRecording = false;

            // Stop Sound (Descending Tone)
            playTone(600, 0.1);
            setTimeout(() => playTone(300, 0.2), 100);

            dynamicIsland.classList.remove('recording');
            diTimerContainer.classList.add('hidden');
            recordBtnInner.classList.remove('recording');
            diTimer.textContent = '00:00';
            updateDynamicIsland("Saving..."); // Updated status
            // Saved status handled in onstop
            clearTimeout(recordingInterval);
        }

        function getSupportedMimeType() {
            const types = [
                'video/mp4', // Prioritize MP4 (Better metadata/seek support)
                'video/webm; codecs=vp9,opus',
                'video/webm; codecs=vp8,opus',
                'video/webm'
            ];
            for (const type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    console.log("Using MIME:", type);
                    return type;
                }
            }
            return ''; // Let browser default
        }

        function updateTimer() {
            if (!isRecording) return;
            const seq = Math.floor((Date.now() - recordingStartTime) / 1000);
            const m = Math.floor(seq / 60).toString().padStart(2, 0);
            const s = (seq % 60).toString().padStart(2, 0);
            diTimer.textContent = `${m}:${s}`;
            recordingInterval = setTimeout(updateTimer, 1000);
        }

        toggleCameraButton.onclick = () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera();
        };

        function setupHandbook() {
            const btn = document.getElementById('handbook-btn');
            const panel = document.getElementById('handbook-panel');
            const close = document.getElementById('close-handbook-btn');
            const container = document.getElementById('handbook-content-container');

            btn.onclick = async () => {
                panel.classList.add('active');
                if (container.children.length === 0) {
                    try {
                        const res = await fetch('handbook.json');
                        const data = await res.json();
                        // Render
                        data.categories.forEach(cat => {
                            const h3 = document.createElement('h3');
                            h3.textContent = cat.category;
                            container.appendChild(h3);
                            cat.entries.forEach(entry => {
                                const div = document.createElement('div');
                                div.className = 'handbook-entry';
                                div.innerHTML = `<strong>${entry.name}</strong><p>${entry.description}</p>`;
                                container.appendChild(div);
                            });
                        });
                    } catch (e) { container.innerHTML = '<p>Offline handbook unavailable.</p>'; }
                }
            };
            close.onclick = () => panel.classList.remove('active');

            // PWA Install Logic
            let deferredPrompt;
            const toast = document.getElementById('install-toast');
            const installBtn = document.getElementById('toast-install-btn');
            const dismissBtn = document.getElementById('toast-dismiss-btn');

            // Check if already installed (heuristic)
            if (window.matchMedia('(display-mode: standalone)').matches) {
                toast.classList.remove('visible'); // Don't show in app
            } else {
                // Check for installed apps API
                if ('getInstalledRelatedApps' in navigator) {
                    navigator.getInstalledRelatedApps().then(apps => {
                        if (apps.length > 0) {
                            // Already installed
                            toast.querySelector('span').textContent = "Open Cameraman App for best experience!";
                            installBtn.textContent = "Open";
                            installBtn.onclick = () => {
                                // Try to open via scope? Or just instruct.
                                // There is no direct API to "Open App" from web. 
                                // But we can acknowledge it.
                                alert("Please open 'Cameraman' from your home screen or app library.");
                            };
                            toast.classList.add('visible'); // Show prompt
                        }
                    });
                }

                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    toast.querySelector('span').textContent = "Install this app for the best experience!";
                    installBtn.textContent = "Install";
                    toast.classList.add('visible');

                    installBtn.onclick = async () => {
                        if (deferredPrompt) {
                            deferredPrompt.prompt();
                            const { outcome } = await deferredPrompt.userChoice;
                            console.log(`User response to the install prompt: ${outcome}`);
                            deferredPrompt = null;
                            toast.classList.remove('visible');
                        }
                    };
                });
            }

            dismissBtn.onclick = () => {
                toast.classList.remove('visible');
            };

            window.addEventListener('appinstalled', () => {
                deferredPrompt = null;
                console.log('PWA was installed');
                toast.classList.remove('visible');
            });

        }

        // --- VISIBILITY HANDLER (Prevent Overheating) ---
        document.addEventListener('visibilitychange', async () => {
            if (document.hidden) {
                // Backgrounded: Stop Camera & Mic
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }
                if (recognition) {
                    try { recognition.stop(); } catch (e) { }
                }
                console.log("App backgrounded: Paused resources.");
            } else {
                // Foregrounded: Restart
                console.log("App foregrounded: Resuming...");
                await startCamera();
                // Face Detector is lazy-loaded/re-used

                if (directorModeEnabled) {
                    setupDirectorMode(); // Re-bind
                    startListening();
                }
            }
        });

        window.addEventListener('load', init);
    </script>
</body>
